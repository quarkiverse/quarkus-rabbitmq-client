quarkus.log.level=INFO

quarkus.micrometer.enabled=false
quarkus.otel.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.metric.export.interval=100ms

quarkus.rabbitmqclient.health.enabled=false

# default client non-ssl
quarkus.rabbitmqclient.username=${test.username:guest}
quarkus.rabbitmqclient.password=${test.password:guest}
quarkus.rabbitmqclient.hostname=${test.hostname:localhost}
quarkus.rabbitmqclient.port=${test.amqp-port:5672}

# ssl client
quarkus.rabbitmqclient.ssl.username=${test.username:guest}
quarkus.rabbitmqclient.ssl.password=${test.password:guest}
quarkus.rabbitmqclient.ssl.hostname=${test.hostname:localhost}
quarkus.rabbitmqclient.ssl.port=${test.amqps-port:5671}
quarkus.rabbitmqclient.ssl.tls.enabled=true
quarkus.rabbitmqclient.ssl.tls.trust-store-file = classpath:/rabbitmq/ca/cacerts.jks
quarkus.rabbitmqclient.ssl.tls.trust-store-password = letmein

# mtls client
quarkus.rabbitmqclient.mtls.username=${test.username:guest}
quarkus.rabbitmqclient.mtls.password=${test.password:guest}
quarkus.rabbitmqclient.mtls.hostname=${test.hostname:localhost}
quarkus.rabbitmqclient.mtls.port=${test.amqps-port:5671}
quarkus.rabbitmqclient.mtls.tls.enabled=true
quarkus.rabbitmqclient.mtls.tls.key-store-file = classpath:/rabbitmq/client/client.jks
quarkus.rabbitmqclient.mtls.tls.key-store-password = letmein
quarkus.rabbitmqclient.mtls.tls.trust-store-file = classpath:/rabbitmq/ca/cacerts.jks
quarkus.rabbitmqclient.mtls.tls.trust-store-password = letmein
