quarkus.log.level=INFO
quarkus.otel.enabled=false

quarkus.rabbitmqclient.health.enabled=false
quarkus.rabbitmqclient.metrics.enabled=false

# default client, consumers on virtual threads
quarkus.rabbitmqclient.username=${test.username}
quarkus.rabbitmqclient.password=${test.password}
quarkus.rabbitmqclient.hostname=${test.hostname}
quarkus.rabbitmqclient.port=${test.amqp-port}
quarkus.rabbitmqclient.virtual-threads.enabled=true

# other client, consumers on worker threads
quarkus.rabbitmqclient.other.username=${test.username}
quarkus.rabbitmqclient.other.password=${test.password}
quarkus.rabbitmqclient.other.hostname=${test.hostname}
quarkus.rabbitmqclient.other.port=${test.amqp-port}
